[tools]
deno = "2.9.7"

[tasks.lint]
description = "Check formatting and lint the project"
run = "deno task lint"

[tasks.check]
description = "Run Svelte and TypeScript checks"
run = "deno task check"

[tasks.build]
description = "Build the production site"
run = "deno task build"

[tasks.pre-commit]
description = "Run checks required before committing"
run = [
  "mise current",
  { task = "lint" },
  { task = "check" },
  { task = "build" }
]
